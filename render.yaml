services:
  - type: web
    name: helping-souls
    runtime: python
    region: ohio
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn wsgi --chdir ./src/"
    envVars:
      - key: VITE_BASENAME
        value: /
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: 0
      - key: FLASK_APP_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: helping-souls-db
          property: connectionString

databases:
  - name: helping-souls-db
    region: ohio
    plan: free
    ipAllowList: []
